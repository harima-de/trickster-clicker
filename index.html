<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>트릭스터 클릭커</title><style>:root{font-family:system-ui;color:#f6efff;background:#171329}body{margin:0;background:radial-gradient(circle at top,#493574,#171329 70%)}main{max-width:1000px;margin:auto;padding:22px}h1{margin:0}small{color:#c6bbdb}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel{background:#29213f;border:1px solid #5b4c7b;border-radius:16px;padding:17px;margin:12px 0}.stats b{color:#ffd477;font-size:22px}button{border:0;border-radius:10px;background:#ffd477;color:#271b36;font-weight:bold;padding:11px;margin:3px;cursor:pointer}button:disabled{opacity:.35}.tabs button{background:#51406c;color:white}.tabs button.on{background:#ffd477;color:#271b36}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.hero{text-align:center;padding:20px}.emoji{font-size:80px;display:block}.bar{background:#151025;border-radius:20px;height:15px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#ff899b}.card{padding:12px;border-radius:12px;background:#3a3054;margin:7px 0}.card button{display:block;width:100%}.hidden{display:none}.grid{grid-template-columns:repeat(2,1fr)}.note{color:#fbd78b}@media(max-width:700px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}} </style><style>
.pixel-portrait{width:112px;height:112px;display:block;margin:0 auto 10px;image-rendering:pixelated;filter:drop-shadow(0 5px 0 #161127)}
.pixel-mini{width:62px;height:62px;display:block;margin:0 auto 6px;image-rendering:pixelated}
.pixel-hero{background:radial-gradient(ellipse at 50% 80%,#6a578c 0%,#3d315a 45%,transparent 70%);border-radius:18px}
</style><script>
function pixelSprite(emoji,mini=false){const palette={'🐰':['#ffe4ed','#fa94b6'],'🐂':['#8799d5','#5160a6'],'🐑':['#fff2db','#c4a6da'],'🐉':['#fa9b69','#c95a61'],'🦊':['#ffbe71','#dd774b'],'🦁':['#e9b46e','#b87b43'],'🐱':['#a5a3ea','#6661ab'],'🦝':['#bcb0a4','#71636f']};const p=palette[emoji]||['#d7b5f1','#8d69c7'];let seed=emoji.codePointAt(0),blocks='';const rect=(x,y,w,h,col)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+col+'"/>';blocks+=rect(10,25,12,5,'#30263f');blocks+=rect(12,20,8,7,p[1]);blocks+=rect(8,9,16,13,p[0]);blocks+=rect(10,7,12,3,p[1]);blocks+=rect(11,15,3,3,'#352747')+rect(18,15,3,3,'#352747');blocks+=rect(13,19,6,2,'#ef849c');blocks+=rect(9,22,5,4,p[0])+rect(18,22,5,4,p[0]);if('🐰🐱🦊🐑'.includes(emoji))blocks+=rect(10,2,4,9,p[0])+rect(18,2,4,9,p[0]);else blocks+=rect(7,8,5,5,p[1])+rect(20,8,5,5,p[1]);if('🐉'.includes(emoji))blocks+=rect(14,2,4,7,'#ffd37d');if('🐂'.includes(emoji))blocks+=rect(5,4,5,7,'#eee0bf')+rect(22,4,5,7,'#eee0bf');return '<svg class="'+(mini?'pixel-mini':'pixel-portrait')+'" viewBox="0 0 32 32" role="img" aria-label="도트 캐릭터" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+blocks+'</svg>'}
</script><main><h1>💎 트릭스터 클릭커 <small>v1.0</small></h1><p>⛏️ 발굴 · ⚔️ 사냥 · 📖 수집 · 👑 보스전</p><div class="stats"><div class="panel">🪙 겔더<br><b id="gold"></b></div><div class="panel">⭐ 레벨<br><b id="level"></b></div><div class="panel">⚔️ 공격력<br><b id="atk"></b></div><div class="panel">⛏️ 드릴<br><b id="drill"></b></div></div><div class="tabs" id="tabs"></div><div class="layout"><div><section class="panel" id="content"></section></div><aside><section class="panel"><h2>🗺️ 지역 탐험</h2><div id="zones"></div></section><section class="panel"><h2>📈 성장 현황</h2><div id="profile"></div><div class="bar"><div class="fill" id="xpbar" style="background:#88b9fa"></div></div><p id="progress"></p><button id="export">저장 내보내기</button><button id="import">불러오기</button></section></aside></div><small>비공식 팬 제작 프로토타입 · 원작 이미지/음원 미사용 · 브라우저 자동 저장</small></main><script>
const C=[['토끼','🐰',2,0],['버팔로','🐂',3,0],['양','🐑',1,1],['용','🐉',3,0],['여우','🦊',1,2],['사자','🦁',2,1],['고양이','🐱',2,1],['너구리','🦝',1,2]],Z=[{n:'데저트 해안',l:1,m:[['포푸리','🐚',18,9,5],['모래 두더지','🐹',24,12,7],['코라나','🦀',31,15,9]],b:['투탕카멘','👑',260,180,120]},{n:'메갈로폴리스',l:5,m:[['젤리 몬스터','🟣',75,30,19],['나뭇잎 요정','🍃',90,36,22],['그림자 고양이','🐈‍⬛',110,43,26]],b:['메갈로 수호자','🗿',800,520,300]},{n:'웁스 부두',l:12,m:[['해적 유령','👻',250,85,50],['심해 문어','🐙',310,105,65],['바다 정령','🪼',390,125,80]],b:['심해의 군주','🐲',2600,1700,850]},{n:'스노우 힐',l:22,m:[['눈꽃 정령','❄️',700,210,130],['얼음 늑대','🐺',850,260,155],['설인','☃️',1050,330,195]],b:['빙설의 여왕','👸',7800,4800,2200]}],KEY='trickster-clicker-v1',base=()=>({gold:0,level:1,xp:0,weapon:0,drill:1,auto:false,zone:0,char:0,kills:0,digs:0,treasures:0,dex:{},bossWins:{},monsterIndex:0,hp:18,boss:false});let s=base(),tab='adventure',message='모험을 시작하세요!';try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')s={...s,...v}}catch{};const $=x=>document.getElementById(x),fmt=x=>Math.floor(x).toLocaleString('ko-KR'),xpNeed=()=>30*s.level*s.level,atk=()=>1+s.weapon*2+Math.floor(s.level*.8)+C[s.char][2],power=()=>s.drill+C[s.char][3],mob=()=>s.boss?Z[s.zone].b:Z[s.zone].m[s.monsterIndex%3],max=()=>mob()[2],save=()=>localStorage.setItem(KEY,JSON.stringify(s)),price=t=>t==='weapon'?Math.floor(25*1.55**s.weapon):Math.floor(35*1.6**(s.drill-1));function exp(n){s.xp+=n;while(s.xp>=xpNeed()){s.xp-=xpNeed();s.level++;message='🎉 레벨 '+s.level+' 달성!'}}function attack(){s.hp=Math.max(0,s.hp-atk());if(!s.hp){let m=mob();s.gold+=m[3];exp(m[4]);s.kills++;s.dex[m[0]]=(s.dex[m[0]]||0)+1;if(s.boss){s.bossWins[s.zone]=true;s.boss=false}else s.monsterIndex=(s.monsterIndex+1)%3;s.hp=max();message='🎉 '+m[0]+' 처치! +'+fmt(m[3])+' 겔더'}else message='⚔️ '+fmt(atk())+' 피해!';render()}function dig(){s.digs++;let n=Math.floor((3+Math.random()*8)*power());s.gold+=n;message='⛏️ +'+fmt(n)+' 겔더';if(Math.random()<.09){s.treasures++;s.gold+=30*s.drill;message+=' 💎 보물 발견!'}render()}function buy(t){let n=price(t);if(s.gold<n)return;s.gold-=n;s[t]++;render()}function zone(i){if(s.level<Z[i].l)return;s.zone=i;s.boss=false;s.monsterIndex=0;s.hp=max();message=Z[i].n+'에 도착했습니다!';render()}function render(){s.hp=Math.max(1,Math.min(s.hp,max()));for(let k of ['gold','level','drill'])$(k).textContent=fmt(s[k]);$('atk').textContent=fmt(atk());$('tabs').innerHTML=[['adventure','⚔️ 모험'],['dig','⛏️ 발굴'],['shop','🛒 상점'],['dex','📖 도감'],['character','👤 캐릭터']].map(([k,n])=>'<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'">'+n+'</button>').join('');let h='';if(tab==='adventure')h='<h2>⚔️ '+Z[s.zone].n+'</h2><div class="hero"><span class="emoji">'+mob()[1]+'</span><h2>'+mob()[0]+(s.boss?' · BOSS':'')+'</h2><p>'+fmt(s.hp)+' / '+fmt(max())+' HP</p><div class="bar"><div class="fill" style="width:'+(s.hp/max()*100)+'%"></div></div><button data-act="attack">⚔️ 공격하기</button><button data-act="auto">🤖 자동 사냥 '+(s.auto?'ON':'OFF')+'</button><button data-act="boss">👑 보스 '+(s.boss?'취소':'도전')+'</button></div>';if(tab==='dig')h='<h2>⛏️ 드릴 발굴</h2><div class="hero"><span class="emoji">⛏️</span><p>발굴 횟수 '+fmt(s.digs)+'회</p><button data-act="dig">⛏️ 발굴하기</button><p>보물 '+fmt(s.treasures)+'개</p></div>';if(tab==='shop')h='<h2>🛒 장비 강화</h2>'+[['weapon','⚔️ 무기','공격력 +2'],['drill','⛏️ 드릴','발굴 보상 증가']].map(([k,n,d])=>'<div class="card"><b>'+n+' Lv.'+s[k]+'</b><p>'+d+'</p><button data-buy="'+k+'" '+(s.gold<price(k)?'disabled':'')+'>🪙 '+fmt(price(k))+' 겔더</button></div>').join('');if(tab==='character')h='<h2>👤 캐릭터 선택</h2><div class="grid">'+C.map((c,i)=>'<button data-char="'+i+'" style="'+(s.char===i?'outline:3px solid white':'')+'"><span style="font-size:30px">'+c[1]+'</span><br>'+c[0]+'<br><small>공격 +'+c[2]+' / 발굴 +'+c[3]+'</small></button>').join('')+'</div>';if(tab==='dex'){let all=Z.flatMap(z=>[...z.m,z.b]);h='<h2>📖 몬스터 도감 '+Object.keys(s.dex).length+' / '+all.length+'</h2><div class="grid">'+all.map(m=>'<div class="card">'+(s.dex[m[0]]?pixelSprite(m[1],true)+' '+m[0]:'❔ 미발견')+'<p>'+ (s.dex[m[0]]?'처치 '+s.dex[m[0]]+'회':'사냥해서 발견하세요')+'</p></div>').join('')+'</div>'} $('content').innerHTML=h+'<p class="note">'+message+'</p>';$('zones').innerHTML=Z.map((z,i)=>'<div class="card"><b>'+z.n+'</b><p>Lv.'+z.l+' · '+(s.bossWins[i]?'👑 격파 완료':'👑 미격파')+'</p><button data-zone="'+i+'" '+(s.level<z.l?'disabled':'')+'>'+(s.zone===i?'현재 지역':'이동하기')+'</button></div>').join('');$('profile').textContent=C[s.char][1]+' '+C[s.char][0]+' · 경험치 '+fmt(s.xp)+' / '+fmt(xpNeed());$('xpbar').style.width=(s.xp/xpNeed()*100)+'%';$('progress').textContent='처치 '+fmt(s.kills)+'마리 · 보스 '+Object.keys(s.bossWins).filter(k=>s.bossWins[k]).length+'회';save()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){tab=d.tab;render()}if(d.act==='attack')attack();if(d.act==='dig')dig();if(d.act==='auto'){s.auto=!s.auto;render()}if(d.act==='boss'){s.boss=!s.boss;s.hp=max();render()}if(d.buy)buy(d.buy);if(d.zone!==undefined)zone(+d.zone);if(d.char!==undefined){s.char=+d.char;render()}});$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.href=u;a.download='trickster-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{let v=JSON.parse(await i.files[0].text());if(!v||!Number.isFinite(v.gold)||!Number.isInteger(v.zone)||v.zone<0||v.zone>=Z.length||!Number.isInteger(v.char)||v.char<0||v.char>=C.length)throw 0;s={...base(),...v};s.hp=max();render();alert('불러오기 완료')}catch{alert('잘못된 저장 파일')}};i.click()};setInterval(()=>{if(s.auto)attack()},1200);render();
</script></html>
